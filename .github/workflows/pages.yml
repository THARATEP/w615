# ทดสอบสูตรคำนวณ แล้วเผยแพร่โฟลเดอร์ web/ ขึ้น GitHub Pages ทุกครั้งที่ push เข้า main
name: Test & Deploy PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node tools/build.mjs
      - name: Test (ตัวอย่างในหนังสือ ว 651)
        run: node --test tests/engine.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
