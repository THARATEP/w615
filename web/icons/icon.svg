<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d7a50"/><stop offset="1" stop-color="#0b3322"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2cf5b"/><stop offset="1" stop-color="#c99a1e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04180f" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect id="plate" width="512" height="512" rx="112" fill="url(#bg)"/>
  <g id="art">
    <!-- BOQ sheet -->
    <g filter="url(#sh)">
      <path d="M128 92h188l68 68v260a20 20 0 0 1-20 20H128a20 20 0 0 1-20-20V112a20 20 0 0 1 20-20z" fill="#ffffff"/>
      <path d="M316 92v48a20 20 0 0 0 20 20h48z" fill="#cfe5d8"/>
    </g>
    <!-- header bar -->
    <rect x="138" y="176" width="216" height="30" rx="6" fill="#16603f"/>
    <!-- table rows: item column + price column -->
    <g fill="#b7d3c3">
      <rect x="138" y="224" width="118" height="16" rx="5"/><rect x="272" y="224" width="82" height="16" rx="5"/>
      <rect x="138" y="258" width="96" height="16" rx="5"/><rect x="272" y="258" width="82" height="16" rx="5"/>
      <rect x="138" y="292" width="118" height="16" rx="5"/><rect x="272" y="292" width="82" height="16" rx="5"/>
      <rect x="138" y="326" width="80" height="16" rx="5"/>
    </g>
    <!-- discount badge -->
    <g filter="url(#sh)">
      <circle cx="356" cy="364" r="86" fill="url(#gold)"/>
    </g>
    <circle cx="356" cy="364" r="86" fill="none" stroke="#fff6d6" stroke-width="6" opacity=".7"/>
    <g fill="none" stroke="#0b3322" stroke-width="15" stroke-linecap="round"><circle cx="327" cy="333" r="17"/><circle cx="385" cy="395" r="17"/><path d="M392 318L320 410"/></g>
  </g>
</svg>
